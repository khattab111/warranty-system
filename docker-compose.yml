services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: warranty-system:dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: warranty_system
      DB_USERNAME: warranty_system
      DB_PASSWORD: warranty_system
      CACHE_STORE: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warranty_system
      POSTGRES_USER: warranty_system
      POSTGRES_PASSWORD: warranty_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warranty_system -d warranty_system"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
